
[env:m5stack-stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino

board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.embed_files =
    assets/codex-pet.bin
    assets/codex-muyu.wav
    assets/codex-muyu-100.wav
    assets/codex-smoke.wav
    assets/codex-whisky.wav
    assets/codex-dice.wav
    assets/codex-workout.wav

monitor_speed = 115200

build_unflags = -std=gnu++11

build_flags =
    -std=gnu++17
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    M5Unified = https://github.com/m5stack/M5Unified#368ad60807161625aa65baad37a4a3af2a7eccea
    M5GFX = https://github.com/m5stack/M5GFX#65c816a38386062d2c3dc47d41237a9083acbc75
    M5PM1 = https://github.com/m5stack/M5PM1#be9a5456c007c333e7ac963f33bfde1ffa5d82ee
    M5IOE1 = https://github.com/m5stack/M5IOE1#846eec7d05e25c09013be2acdb8804487f48a62e
    bblanchon/ArduinoJson @ 6.21.5
